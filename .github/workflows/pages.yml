name: Build and deploy Muslim Assistant

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm run build
      - name: Verify static build
        run: |
          test -s dist/index.html
          test -s dist/knowledge.json
          ! grep -R -E 'sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}' dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
