name: Bug report
description: Report a reproducible problem in the current web application.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For security vulnerabilities, do not open a public issue. Follow [SECURITY.md](https://github.com/cooolv/Muslim-Bot/blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
      placeholder: A concise description of the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: List the steps needed to reproduce this issue.
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include browser, operating system, and whether this happened on the live site or locally.
      placeholder: Browser and version, operating system, live/local
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add relevant screenshots or details. Remove personal data and secrets before posting.
    validations:
      required: false
